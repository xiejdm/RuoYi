<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改方剂')" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-prescription-edit" th:object="${prescription}">
        <input name="id" th:field="*{id}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">方剂名称：</label>
            <div class="col-sm-8">
                <input name="prescriptionName" th:field="*{prescriptionName}" class="form-control" type="text" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">功效：</label>
            <div class="col-sm-8">
                <textarea name="functionDesc" class="form-control" rows="3" required th:text="*{functionDesc}"></textarea>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">主治：</label>
            <div class="col-sm-8">
                <textarea name="indications" class="form-control" rows="3" required th:text="*{indications}"></textarea>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">制备方法：</label>
            <div class="col-sm-8">
                <textarea name="preparationMethod" class="form-control" rows="3" th:text="*{preparationMethod}"></textarea>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">出处：</label>
            <div class="col-sm-8">
                <input name="sourceClassic" th:field="*{sourceClassic}" class="form-control" type="text">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">备注：</label>
            <div class="col-sm-8">
                <textarea name="remarks" class="form-control" rows="2" th:text="*{remarks}"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer" />
<script type="text/javascript">
    var prefix = ctx + "medical/prescription";

    $("#form-prescription-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/edit", $('#form-prescription-edit').serialize());
        }
    }
</script>
</body>
</html>
