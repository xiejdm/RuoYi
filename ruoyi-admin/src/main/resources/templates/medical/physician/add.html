<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('新增医家')" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-physician-add">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">医家姓名：</label>
            <div class="col-sm-8">
                <input name="physicianName" class="form-control" type="text" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">代际：</label>
            <div class="col-sm-8">
                <input name="generation" class="form-control" type="number" min="1" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">师承：</label>
            <div class="col-sm-8">
                <input name="teacher" class="form-control" type="text">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">学术思想：</label>
            <div class="col-sm-8">
                <textarea name="academicThought" class="form-control" rows="3"></textarea>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">擅长领域：</label>
            <div class="col-sm-8">
                <textarea name="specialty" class="form-control" rows="2"></textarea>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">代表著作：</label>
            <div class="col-sm-8">
                <textarea name="representativeWorks" class="form-control" rows="2"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer" />
<script type="text/javascript">
    var prefix = ctx + "medical/physician";

    $("#form-physician-add").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/add", $('#form-physician-add').serialize());
        }
    }
</script>
</body>
</html>
