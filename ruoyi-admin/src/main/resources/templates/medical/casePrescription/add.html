<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('新增医案-方剂关系')" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-casePrescription-add">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">医案ID：</label>
            <div class="col-sm-8">
                <input name="caseId" class="form-control" type="number" min="1" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">方剂ID：</label>
            <div class="col-sm-8">
                <input name="prescriptionId" class="form-control" type="number" min="1" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">用法：</label>
            <div class="col-sm-8">
                <input name="usageMethod" class="form-control" type="text" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">加减变化：</label>
            <div class="col-sm-8">
                <textarea name="dosageAdjustment" class="form-control" rows="2"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer" />
<script type="text/javascript">
    var prefix = ctx + "medical/casePrescription";

    $("#form-casePrescription-add").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/add", $('#form-casePrescription-add').serialize());
        }
    }
</script>
</body>
</html>
