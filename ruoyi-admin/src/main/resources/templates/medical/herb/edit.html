<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改中药')" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-herb-edit" th:object="${herb}">
        <input name="id" th:field="*{id}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">中药名：</label>
            <div class="col-sm-8">
                <input name="herbName" th:field="*{herbName}" class="form-control" type="text" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">拉丁学名：</label>
            <div class="col-sm-8">
                <input name="latinName" th:field="*{latinName}" class="form-control" type="text">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">性：</label>
            <div class="col-sm-8">
                <input name="property" th:field="*{property}" class="form-control" type="text">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">味：</label>
            <div class="col-sm-8">
                <input name="taste" th:field="*{taste}" class="form-control" type="text">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">归经：</label>
            <div class="col-sm-8">
                <input name="meridian" th:field="*{meridian}" class="form-control" type="text">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">功效：</label>
            <div class="col-sm-8">
                <textarea name="functionDesc" class="form-control" rows="3" required th:text="*{functionDesc}"></textarea>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">用药注意：</label>
            <div class="col-sm-8">
                <textarea name="usageNote" class="form-control" rows="2" th:text="*{usageNote}"></textarea>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">炮制后性味归经：</label>
            <div class="col-sm-8">
                <select name="processedPropertyMeridian" class="form-control" th:with="type=${@dict.getType('tcm_processed_meridian')}">
                    <option value="">请选择</option>
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:selected="${dict.dictValue == herb.processedPropertyMeridian}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">炮制方法：</label>
            <div class="col-sm-8">
                <select name="processingMethod" class="form-control" th:with="method=${@dict.getType('tcm_processing_method')}">
                    <option value="">请选择</option>
                    <option th:each="dict : ${method}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:selected="${dict.dictValue == herb.processingMethod}"></option>
                </select>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer" />
<script type="text/javascript">
    var prefix = ctx + "medical/herb";

    $("#form-herb-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/edit", $('#form-herb-edit').serialize());
        }
    }
</script>
</body>
</html>
